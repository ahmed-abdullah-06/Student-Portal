services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-student_portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-student_portal}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars)}
      PORT: 5000
      TRUST_PROXY: '1'
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Novastra <no-reply@novastra.edu.pk>}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_ACCOUNT_SID: ${SMS_ACCOUNT_SID:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
      SMS_FROM: ${SMS_FROM:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-pkr}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:5000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
